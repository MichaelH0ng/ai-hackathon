<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="NorthStar brings your accounts, savings goals, and spending choices together so you can keep your financial goals in sight." />
    <title>NorthStar</title>
    <!-- Apply the saved Light/Dark choice before the page paints, so it never flashes the wrong theme. Mirrors src/lib/theme.ts. -->
    <script>
      try {
        var t = localStorage.getItem("northstar:theme");
        document.documentElement.dataset.theme = t === "light" || t === "dark" ? t : "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
